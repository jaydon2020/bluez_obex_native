name: CI

on:
  push:    { branches: [main, develop] }
  pull_request: { branches: [main] }
  workflow_call:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  test-dart:
    name: Dart and private-bus tests
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with: { submodules: recursive }
      - uses: subosito/flutter-action@v2
        with: { channel: stable }
      - name: Install native and private-bus dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            cmake ninja-build g++ pkg-config libsystemd-dev \
            dbus-daemon python3-dbus python3-gi
      - run: dart pub get
      - run: dart test
      - run: flutter pub get
        working-directory: example/flutter_phone_message
      - run: flutter test
        working-directory: example/flutter_phone_message

  package:
    name: Archive, offline build and relocated bundle
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with: { submodules: recursive }
      - uses: subosito/flutter-action@v2
        with: { channel: stable }
      - name: Install package verification dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            cmake ninja-build g++ pkg-config binutils libsystemd-dev \
            dbus-daemon python3-dbus python3-gi
      - run: dart pub get
      - run: /usr/bin/python3 scripts/verify_package.py

  generated-bindings:
    name: Generated Dart bindings
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with: { submodules: recursive }
      - uses: subosito/flutter-action@v2
        with: { channel: stable }
      - name: Install libclang
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            libclang-19-dev cmake ninja-build g++ pkg-config libsystemd-dev
      - run: dart pub get
      - run: dart run ffigen --config ffigen.yaml
      - run: git diff --exit-code -- lib/bluez_obex_native_bindings_generated.dart

  # ── Format ────────────────────────────────────────────────────────────────
  format:
    name: Format check
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with: { submodules: recursive }
      - uses: subosito/flutter-action@v2
        with: { channel: stable }
      - name: Install native format deps
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends clang-format-19
      - run: dart pub get
      - run: dart format --output=none --set-exit-if-changed lib/ example/ hook/ test/
      - run: ./scripts/clang_format.sh check

  # ── Static analysis + pub points dry-run ─────────────────────────────────
  analyze:
    name: Analysis and pub dry-run
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with: { submodules: recursive }
      - uses: subosito/flutter-action@v2
        with: { channel: stable }
      - run: dart pub get
      # Verify all pub.dev requirements pass before any PR merges.
      - run: dart pub publish --dry-run
      - run: flutter pub get
        working-directory: example/flutter_phone_message
      - run: dart analyze --fatal-infos

  # ── C++ unit tests ───────────────────────────────────────────────────────
  test-cpp:
    name: C++ unit tests
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with: { submodules: recursive }
      - name: Install deps
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            cmake ninja-build \
            clang-19 \
            libsystemd-dev
      - name: Build + test
        run: |
          cmake -B build native/ -GNinja \
            -DCMAKE_BUILD_TYPE=Debug \
            -DCMAKE_CXX_COMPILER=clang++-19 \
            -DCMAKE_C_COMPILER=clang-19 \
            -DBUILD_TESTING=ON
          cmake --build build --parallel
          ctest --test-dir build --output-on-failure -j4

  # ── Generated sdbus-c++ proxies ──────────────────────────────────────────
  generated-proxies:
    name: Generated proxies
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with: { submodules: recursive }
      - name: Install deps
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            cmake ninja-build \
            libsystemd-dev \
            libexpat1-dev
      - name: Verify proxy generation
        run: |
          ./scripts/generate_proxies.sh
          git diff --exit-code native/generated/ || \
            (echo "Generated proxies are out of date. Run scripts/generate_proxies.sh" && exit 1)

  # ── ASAN + UBSan ─────────────────────────────────────────────────────────
  asan:
    name: ASAN + UBSan
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with: { submodules: recursive }
      - name: Install deps
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            cmake ninja-build clang-19 libclang-rt-19-dev \
            libsystemd-dev
      - run: ./scripts/asan.sh build-asan

  # ── clang-tidy ───────────────────────────────────────────────────────────
  clang-tidy:
    name: clang-tidy
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with: { submodules: recursive }
      - name: Install deps
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            cmake ninja-build \
            clang-19 clang-tidy-19 \
            libsystemd-dev
      - name: Build (for compile_commands.json)
        run: |
          cmake -B build native/ -GNinja \
            -DCMAKE_BUILD_TYPE=Debug \
            -DCMAKE_CXX_COMPILER=clang++-19 \
            -DCMAKE_C_COMPILER=clang-19 \
            -DBUILD_TESTING=ON
          cmake --build build --parallel
      - run: ./scripts/clang_tidy.sh build

  # ── Coverage (PR only) ──────────────────────────────────────────────────
  coverage:
    name: Coverage
    runs-on: ubuntu-24.04
    needs: [test-cpp]
    if: github.event_name == 'pull_request' || startsWith(github.ref, 'refs/tags/')
    steps:
      - uses: actions/checkout@v4
        with: { submodules: recursive }
      - name: Install deps
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            cmake ninja-build gcc g++ \
            libsystemd-dev lcov
      - run: ./scripts/coverage.sh build-cov
