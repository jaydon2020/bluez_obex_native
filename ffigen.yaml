# Run with `dart run ffigen --config ffigen.yaml`.
name: BluezObexNativeBindings
description: |
  Bindings for `native/include/bluez_obex_native.h`.

  Regenerate bindings with `dart run ffigen --config ffigen.yaml`.
output: 'lib/bluez_obex_native_bindings_generated.dart'
headers:
  entry-points:
    - 'native/include/bluez_obex_native.h'
  include-directives:
    - 'native/include/bluez_obex_native.h'
preamble: |
  /*
